<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>İnternet yoxdur · TradeFlow</title>
    <link rel="icon" href="__BASE__favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --ink: #0b1122; --muted: #5b6475; --brand: #0f766e; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b1122; --card: #121a2e; --ink: #e6e9f0; --muted: #94a0b8; --brand: #2dd4bf; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 380px; text-align: center; background: var(--card); border-radius: 16px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
        img { width: 64px; height: 64px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { color: var(--muted); margin: 0 0 20px; }
        a { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <img src="__BASE__icons/icon-192.png" alt="">
    <h1>İnternet bağlantısı yoxdur</h1>
    <p>TradeFlow məlumatları serverdən götürür. Bağlantı bərpa olunanda səhifəni yeniləyin.</p>
    <a href="">Yenidən cəhd et</a>
</main>
</body>
</html>
